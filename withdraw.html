<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw — EasyPay</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261;--bg:#f0f7f4}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:var(--bg);padding:16px}
.container{max-width:600px;margin:auto}
.page-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{background:#fff;border:none;padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-family:'Poppins';box-shadow:0 2px 8px rgba(0,0,0,.06);font-size:13px;color:var(--g1)}
.page-head h1{font-size:20px;font-weight:700}

.info-bar{
  background:#fff8e1;border:1.5px solid #ffca28;padding:14px 18px;border-radius:12px;
  margin-bottom:20px;font-size:13px;color:#6d5600;line-height:1.5;
}

.form-card{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05);margin-bottom:20px}
.form-card h2{font-size:18px;color:var(--g1);margin-bottom:16px}
.form-card label{display:block;margin-bottom:4px;font-weight:600;font-size:13px;color:#444}
.form-card input,.form-card select{
  width:100%;padding:11px 14px;margin-bottom:14px;border:2px solid #e0e8e3;border-radius:10px;
  font-size:14px;font-family:'Poppins';transition:.2s;
}
.form-card input:focus,.form-card select:focus{border-color:var(--g1);outline:none;box-shadow:0 0 0 3px rgba(0,159,77,.1)}
.submit-btn{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--g1),var(--g2));
  color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;
  font-family:'Poppins';cursor:pointer;transition:.3s;
  box-shadow:0 4px 14px rgba(0,159,77,.25);
}
.submit-btn:hover{transform:translateY(-2px)}
.submit-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;width:16px;height:16px;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}

.records{background:#fff;padding:22px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.records h3{font-size:16px;font-weight:700;margin-bottom:12px;color:var(--g1)}
.table-wrap{overflow-x:auto;border-radius:10px;max-height:360px}
table{width:100%;border-collapse:collapse;min-width:500px}
th{background:var(--g1);color:#fff;padding:10px 12px;font-size:12px;text-align:left;font-weight:600;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
.status{padding:3px 10px;border-radius:20px;color:#fff;font-weight:700;font-size:11px}
.s-pending{background:#f59e0b}.s-approved{background:#16a34a}.s-rejected{background:#dc2626}

.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:#1a2e1a;color:#fff;padding:14px 24px;border-radius:12px;
  font-size:14px;z-index:10000;transition:transform .4s;max-width:90%;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.error{background:#c62828}
</style>
</head>
<body>
<div class="container">
  <div class="page-head">
    <button class="back" onclick="location.href='dashboard.html'">← Back</button>
    <h1>Withdraw Funds</h1>
  </div>

  <div class="info-bar">
    ⏱ Withdrawals are processed within <strong>24 hours</strong>. Make only one request per day.
  </div>

  <div class="form-card">
    <h2>Request Withdrawal</h2>
    <label>Amount (₦)</label>
    <input type="number" id="amount" placeholder="Minimum ₦1,000" min="1000">
    <label>Bank</label>
    <select id="bank">
      <option value="">Select Bank</option>
      <option>Access Bank</option><option>Kuda</option><option>PalmPay</option>
      <option>Moniepoint</option><option>Opay</option><option>GTBank</option>
      <option>First Bank</option><option>UBA</option><option>Zenith Bank</option>
      <option>Wema Bank</option><option>SmartCash PSB</option><option>Momo PSB</option>
    </select>
    <label>Account Name</label>
    <input type="text" id="accName" placeholder="Name on account">
    <label>Account Number</label>
    <input type="text" id="accNumber" placeholder="10-digit account number" maxlength="10" pattern="[0-9]{10}">
    <button class="submit-btn" id="submitBtn">Submit Withdrawal</button>
  </div>

  <div class="records">
    <h3>Withdrawal History</h3>
    <div class="table-wrap">
      <table id="withdrawalTable">
        <thead><tr><th>Date</th><th>Amount</th><th>Bank</th><th>Account</th><th>Status</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,doc,getDoc,updateDoc,collection,addDoc,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({
  apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",
  authDomain:"easypay-6bce8.firebaseapp.com",
  projectId:"easypay-6bce8"
});
const auth=getAuth(app);
const db=getFirestore(app);

function toast(msg,isErr){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show'+(isErr?' error':'');
  setTimeout(()=>t.className='toast',3000);
}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

const btn=document.getElementById('submitBtn');

onAuthStateChanged(auth,async user=>{
  if(!user){window.location.href='login.html';return}
  btn.addEventListener('click',()=>submitWithdrawal(user.uid));
  loadWithdrawals(user.uid);
});

async function submitWithdrawal(uid){
  const amount=parseFloat(document.getElementById('amount').value);
  const bank=document.getElementById('bank').value;
  const accName=document.getElementById('accName').value.trim();
  const accNumber=document.getElementById('accNumber').value.trim();

  if(!amount||amount<1000)return toast('Minimum withdrawal is ₦1,000',true);
  if(!bank)return toast('Select a bank',true);
  if(!accName)return toast('Enter account name',true);
  if(!/^\d{10}$/.test(accNumber))return toast('Enter valid 10-digit account number',true);

  // Sanitize inputs
  if(accName.length>100)return toast('Account name too long',true);

  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Processing...';

  try{
    const userRef=doc(db,'users',uid);
    const userDoc=await getDoc(userRef);
    const balance=userDoc.data().balance||0;
    if(amount>balance){toast('Insufficient balance',true);resetBtn();return}

    await updateDoc(userRef,{balance:balance-amount});
    await addDoc(collection(userRef,'withdrawals'),{
      timestamp:new Date(),amount,bank,accName,accNumber,status:'pending'
    });

    toast('Withdrawal submitted!');
    ['amount','bank','accName','accNumber'].forEach(id=>document.getElementById(id).value='');
    loadWithdrawals(uid);
  }catch(err){
    console.error(err);toast('Something went wrong',true);
  }
  resetBtn();
}

function resetBtn(){btn.disabled=false;btn.textContent='Submit Withdrawal'}

async function loadWithdrawals(uid){
  const tbody=document.querySelector('#withdrawalTable tbody');
  tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">Loading...</td></tr>';
  const wRef=collection(doc(db,'users',uid),'withdrawals');
  const q=query(wRef,orderBy('timestamp','desc'),limit(20));
  const snap=await getDocs(q);

  if(snap.empty){tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:#999;padding:20px">No withdrawals yet</td></tr>';return}
  tbody.innerHTML='';
  snap.forEach(d=>{
    const w=d.data();
    const date=new Date(w.timestamp.seconds*1000).toLocaleString();
    const cls=w.status==='approved'||w.status==='Successful'?'s-approved':w.status==='rejected'||w.status==='Rejected'?'s-rejected':'s-pending';
    const statusLabel=w.status.charAt(0).toUpperCase()+w.status.slice(1);
    tbody.innerHTML+=`<tr><td>${esc(date)}</td><td>₦${esc(w.amount)}</td><td>${esc(w.bank)}</td><td>${esc(w.accNumber)}</td><td><span class="status ${cls}">${esc(statusLabel)}</span></td></tr>`;
  });
}
</script>
</body>
</html>
