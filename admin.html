<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — EasyPay</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261;--dark:#0d1117;--bg:#f0f7f4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#1a2e1a}
header{
  background:linear-gradient(135deg,#006b35,var(--g1));color:#fff;
  padding:16px 24px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.1);
}
header h1{font-size:18px;font-weight:800}
header button{
  background:rgba(255,255,255,.15);color:#fff;border:none;padding:8px 16px;
  border-radius:8px;font-weight:600;cursor:pointer;font-family:'Poppins';font-size:13px;
}
.container{padding:24px;max-width:1000px;margin:auto}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:24px}
.stat-card{
  background:#fff;padding:24px;border-radius:16px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);text-align:center;
}
.stat-card h2{font-size:32px;font-weight:800;color:var(--g1)}
.stat-card p{font-size:13px;color:#6b7c6b;margin-top:4px;font-weight:500}
.links-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.admin-link{
  background:#fff;padding:20px;border-radius:14px;
  box-shadow:0 4px 16px rgba(0,0,0,.05);text-decoration:none;color:#1a2e1a;
  display:flex;flex-direction:column;align-items:center;gap:10px;transition:.2s;
}
.admin-link:hover{transform:translateY(-4px);box-shadow:0 8px 24px rgba(0,0,0,.1)}
.admin-link .icon{font-size:32px}
.admin-link span{font-size:14px;font-weight:700}
</style>
</head>
<body>
<header>
  <h1>Admin Dashboard</h1>
  <button id="logoutBtn">Logout</button>
</header>
<main class="container">
  <section class="stats-grid">
    <div class="stat-card"><h2 id="totalUsers">—</h2><p>Total Users</p></div>
    <div class="stat-card"><h2 id="totalDeposits">—</h2><p>Deposit Requests</p></div>
  </section>
  <section class="links-grid">
    <a href="admin-deposit.html" class="admin-link"><span class="icon">💳</span><span>Deposits</span></a>
    <a href="admin-users.html" class="admin-link"><span class="icon">👥</span><span>Manage Users</span></a>
    <a href="admin-withdraw.html" class="admin-link"><span class="icon">💰</span><span>Withdrawals</span></a>
  </section>
</main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,getDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",authDomain:"easypay-6bce8.firebaseapp.com",projectId:"easypay-6bce8"});
const auth=getAuth(app);
const db=getFirestore(app);

document.getElementById('logoutBtn').onclick=()=>signOut(auth).then(()=>location.href='login.html');

onAuthStateChanged(auth,async user=>{
  if(!user)return signOut(auth).then(()=>location.href='login.html');
  // Check admin role from Firestore
  const userSnap=await getDoc(doc(db,'users',user.uid));
  if(!userSnap.exists()||userSnap.data().role!=='admin'){
    return signOut(auth).then(()=>location.href='login.html');
  }
  loadStats();
});

async function loadStats(){
  const colSize=async c=>(await getDocs(collection(db,c))).size;
  const[u,d]=await Promise.all([colSize('users'),colSize('deposits')]);
  document.getElementById('totalUsers').innerText=u;
  document.getElementById('totalDeposits').innerText=d;
}
</script>
</body>
</html>
