<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — EasyPay</title>
<meta name="description" content="Create your EasyPay investment account and start earning daily">
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0a1a12,#0f2f1e,#1a4a2e);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.card{
  background:#fff;padding:32px 28px;border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:420px;text-align:center;
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{width:70px;height:70px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;border:3px solid var(--g1)}
h2{color:#1a2e1a;font-size:22px;font-weight:700;margin-bottom:6px}
.sub{color:#6b7c6b;font-size:13px;margin-bottom:20px}
.input-group{margin-bottom:12px;text-align:left}
.input-group label{display:block;margin-bottom:4px;font-weight:600;font-size:12px;color:#444}
.input-group input{
  width:100%;padding:11px 14px;border:2px solid #e0e8e3;border-radius:10px;
  font-size:14px;font-family:'Poppins';transition:.2s;
}
.input-group input:focus{border-color:var(--g1);outline:none;box-shadow:0 0 0 3px rgba(0,159,77,.1)}
.input-group .err{color:#c62828;font-size:11px;margin-top:3px;display:none}
.input-group.invalid .err{display:block}
.input-group.invalid input{border-color:#c62828}
.terms{display:flex;align-items:flex-start;gap:8px;font-size:12px;margin:14px 0;text-align:left;color:#555}
.terms a{color:var(--g1);font-weight:600}
.terms input{margin-top:2px}
.btn{
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:none;
  width:100%;padding:13px;border-radius:10px;cursor:pointer;font-weight:700;
  font-size:15px;font-family:'Poppins';transition:.3s;
  box-shadow:0 4px 14px rgba(0,159,77,.25);
}
.btn:hover{transform:translateY(-2px)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.spinner{border:3px solid rgba(255,255,255,.3);border-top:3px solid #fff;border-radius:50%;width:16px;height:16px;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{0%{transform:rotate(0deg)}100%{transform:rotate(360deg)}}
.footer{margin-top:16px;font-size:13px}
.footer a{color:var(--g1);text-decoration:none;font-weight:600}
.toast{
  position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);
  background:#c62828;color:#fff;padding:14px 24px;border-radius:12px;
  font-size:14px;z-index:10000;transition:transform .4s;max-width:90%;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.pw-strength{height:4px;border-radius:2px;margin-top:4px;transition:.3s;background:#e8e8e8}
.pw-strength.weak{background:#ef5350;width:33%}
.pw-strength.medium{background:#ffa726;width:66%}
.pw-strength.strong{background:#66bb6a;width:100%}
</style>
</head>
<body>
<div class="card">
  <img src="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg" class="logo" alt="EasyPay">
  <h2>Create Account</h2>
  <p class="sub">Start your investment journey today</p>

  <div class="input-group" id="ig-username">
    <label>Username</label>
    <input type="text" id="username" placeholder="Choose a username" autocomplete="username">
    <div class="err">Username is required</div>
  </div>
  <div class="input-group" id="ig-fullname">
    <label>Full Name</label>
    <input type="text" id="fullname" placeholder="Your full name" autocomplete="name">
    <div class="err">Full name is required</div>
  </div>
  <div class="input-group" id="ig-email">
    <label>Email</label>
    <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
    <div class="err">Please enter a valid email</div>
  </div>
  <div class="input-group" id="ig-password">
    <label>Password</label>
    <input type="password" id="password" placeholder="Min 6 characters" autocomplete="new-password">
    <div class="pw-strength" id="pwStrength"></div>
    <div class="err">Password must be at least 6 characters</div>
  </div>
  <div class="input-group" id="ig-confirm">
    <label>Confirm Password</label>
    <input type="password" id="confirm-password" placeholder="Re-enter password" autocomplete="new-password">
    <div class="err">Passwords do not match</div>
  </div>
  <div class="input-group">
    <label>Referral Code (Optional)</label>
    <input type="text" id="referral" placeholder="Enter referral code">
  </div>

  <div class="terms">
    <input type="checkbox" id="agreeTerms">
    <label for="agreeTerms">I agree to the <a href="terms.html" target="_blank">Terms & Conditions</a></label>
  </div>

  <button class="btn" id="registerBtn">Create Account</button>
  <div class="footer">
    <p>Already registered? <a href="login.html">Login now</a></p>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,createUserWithEmailAndPassword,sendEmailVerification,deleteUser}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,doc,setDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",
  authDomain:"easypay-6bce8.firebaseapp.com",
  projectId:"easypay-6bce8",
  storageBucket:"easypay-6bce8.appspot.com",
  messagingSenderId:"862671358267",
  appId:"1:862671358267:web:b243c7b69840ef918c8f1e"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3500);
}

// Password strength indicator
const pwInput=document.getElementById('password');
const pwBar=document.getElementById('pwStrength');
pwInput.addEventListener('input',()=>{
  const v=pwInput.value;
  pwBar.className='pw-strength';
  if(v.length===0)return;
  if(v.length<6)pwBar.classList.add('weak');
  else if(v.length<10||!/[A-Z]/.test(v)||!/[0-9]/.test(v))pwBar.classList.add('medium');
  else pwBar.classList.add('strong');
});

// Autofill referral from URL
const urlRef=new URLSearchParams(window.location.search).get('ref');
if(urlRef)document.getElementById('referral').value=urlRef;

function validate(){
  let ok=true;
  const fields=[
    {id:'username',ig:'ig-username',test:v=>v.length>0},
    {id:'fullname',ig:'ig-fullname',test:v=>v.length>0},
    {id:'email',ig:'ig-email',test:v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)},
    {id:'password',ig:'ig-password',test:v=>v.length>=6},
    {id:'confirm',ig:'ig-confirm',test:v=>v===pwInput.value&&v.length>0}
  ];
  fields.forEach(f=>{
    const el=document.getElementById(f.id==='confirm'?'confirm-password':f.id);
    const ig=document.getElementById(f.ig);
    const value=(f.id==='password'||f.id==='confirm')?el.value:el.value.trim();
    if(!f.test(value)){ig.classList.add('invalid');ok=false}
    else ig.classList.remove('invalid');
  });
  return ok;
}

// Keep a completed profile available if sending the verification email needs a retry.
let registeredUser=null;

document.getElementById('registerBtn').addEventListener('click',async()=>{
  if(document.getElementById('registerBtn').disabled)return;
  if(!validate()){toast('Please fix the errors above');return}
  if(!document.getElementById('agreeTerms').checked){toast('Please agree to Terms & Conditions');return}

  const btn=document.getElementById('registerBtn');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span>Creating account...';

  const username=document.getElementById('username').value.trim();
  const fullname=document.getElementById('fullname').value.trim();
  const email=document.getElementById('email').value.trim();
  const password=pwInput.value;
  const referral=document.getElementById('referral').value.trim();

  try{
    if(!registeredUser){
      const cred=await createUserWithEmailAndPassword(auth,email,password);
      try{
      await setDoc(doc(db,'users',cred.user.uid),{
        username:username,
        fullname:fullname,
        email:email,
        referral:referral,
        balance:10,
        plan:'none',
        activePlan:null,
        referralBalance:0,
        createdAt:serverTimestamp(),
        transactions:[{amount:10,type:'Welcome Bonus',date:new Date().toLocaleString()}]
      });

      }catch(profileError){
        // Do not leave an Auth-only account that blocks the next signup attempt.
        try{
          await deleteUser(cred.user);
        }catch(cleanupError){
          console.error('Could not remove incomplete account:',cleanupError);
          toast('Account setup is incomplete. Contact support before trying again.');
          return;
        }
        throw profileError;
      }
      registeredUser=cred.user;
    }
    await sendEmailVerification(registeredUser);

    toast('Registration successful! Check your email to verify.');
    setTimeout(()=>{window.location.href='login.html'},2000);
  }catch(err){
    console.error(err);
    const msgs={
      'auth/email-already-in-use':'This email is already registered',
      'auth/weak-password':'Password is too weak',
      'auth/invalid-email':'Invalid email address',
      'auth/network-request-failed':'Network error. Check your connection and try again.',
      'auth/too-many-requests':'Too many attempts. Please wait before trying again.',
      'permission-denied':'Account setup was denied. Please contact support.'
    };
    toast(registeredUser
      ?'Account created, but verification email could not be sent. Please retry verification.'
      :(msgs[err.code]||'Registration failed. Try again.'));
    btn.disabled=false;
    btn.textContent=registeredUser?'Retry verification email':'Create Account';
  }
});
</script>
</body>
</html>
