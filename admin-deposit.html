<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Deposits — EasyPay</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261;--bg:#f0f7f4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#1a2e1a;padding:20px}
.container{max-width:1100px;margin:auto;background:#fff;padding:20px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
h2{color:var(--g1);margin-bottom:8px;font-size:18px}
.summary{margin-bottom:12px;font-size:13px;color:#6b7c6b}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.controls input,.controls select{padding:8px 12px;border-radius:8px;border:2px solid #e0e8e3;font-size:13px;font-family:'Poppins'}
.controls button{padding:8px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'Poppins';font-size:12px}
.btn-search{background:var(--g1);color:#fff}
.btn-refresh{background:#e8f5e9;color:var(--g1)}
.btn-reset{background:#f1f3f2;color:#444}
.table-wrap{overflow-x:auto;border-radius:10px}
table{width:100%;border-collapse:collapse;min-width:600px}
th{background:var(--g1);color:#fff;padding:10px 12px;font-size:11px;text-align:left;font-weight:600}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
tbody tr:hover{background:#f8fff9}
.action{padding:5px 10px;border:none;border-radius:6px;cursor:pointer;font-weight:700;font-size:11px;color:#fff;font-family:'Poppins'}
.approve{background:#28a745}.reject{background:#dc3545}
.badge{padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;color:#fff}
.b-approved{background:#10b981}.b-rejected{background:#ef4444}.b-pending{background:#f59e0b}
.no-data{text-align:center;color:#999;padding:20px;font-style:italic}
.back{display:inline-block;margin-bottom:12px;color:var(--g1);text-decoration:none;font-weight:600;font-size:13px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a2e1a;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;z-index:10000;transition:transform .4s;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<a href="admin.html" class="back">← Admin Dashboard</a>
<div class="container">
  <h2>Deposit Requests</h2>
  <div class="summary" id="summaryText">Loading...</div>
  <div class="controls">
    <input type="text" id="searchInput" placeholder="Search by ref, name...">
    <button class="btn-search" id="searchBtn">Search</button>
    <button class="btn-reset" id="resetBtn">Reset</button>
    <select id="statusFilter">
      <option value="all">All</option>
      <option value="pending" selected>Pending</option>
      <option value="approved">Approved</option>
      <option value="rejected">Rejected</option>
    </select>
    <button class="btn-refresh" id="refreshBtn">Refresh</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Amount</th><th>Sender</th><th>Ref ID</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody id="adminTable"><tr><td colspan="6" class="no-data">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,getDoc,updateDoc,writeBatch,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",authDomain:"easypay-6bce8.firebaseapp.com",projectId:"easypay-6bce8"});
const auth=getAuth(app);const db=getFirestore(app);

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function formatDate(d){try{if(!d)return'';if(d.seconds)return new Date(d.seconds*1000).toLocaleString();return new Date(d).toLocaleString()}catch{return''}}

const adminTable=document.getElementById('adminTable');
const summaryText=document.getElementById('summaryText');
const searchInput=document.getElementById('searchInput');
const statusFilter=document.getElementById('statusFilter');

const ADMIN_EMAILS=['easypay27.ng@gmail.com','anointedchidi7@gmail.com'];

onAuthStateChanged(auth,async user=>{
  if(!user)return;
  const snap=await getDoc(doc(db,'users',user.uid));
  const isAdmin=(snap.exists()&&snap.data().role==='admin')||
    ADMIN_EMAILS.includes((user.email||'').toLowerCase());
  if(!isAdmin){document.body.innerHTML='<h2 style="padding:20px">Not authorized</h2>';return}
  loadDeposits();
});

async function loadDeposits(){
  adminTable.innerHTML='<tr><td colspan="6" class="no-data">Loading...</td></tr>';
  try{
    const snapshot=await getDocs(collection(db,'deposits'));
    if(snapshot.empty){adminTable.innerHTML='<tr><td colspan="6" class="no-data">No deposits found.</td></tr>';summaryText.textContent='No deposits.';return}
    let deposits=[];snapshot.forEach(d=>deposits.push({id:d.id,...d.data()}));
    const ft=searchInput.value.toLowerCase();
    const st=statusFilter.value;
    deposits=deposits.filter(d=>{
      const ms=st==='all'||(d.status||'pending')===st;
      const mf=!ft||String(d.refId||'').toLowerCase().includes(ft)||String(d.senderName||'').toLowerCase().includes(ft);
      return ms&&mf;
    });
    deposits.sort((a,b)=>{const at=a.date?.seconds?a.date.seconds*1000:0;const bt=b.date?.seconds?b.date.seconds*1000:0;return bt-at});
    const counts=deposits.reduce((a,d)=>{const s=d.status||'pending';a[s]=(a[s]||0)+1;return a},{});
    summaryText.textContent=`Pending: ${counts.pending||0} | Approved: ${counts.approved||0} | Rejected: ${counts.rejected||0}`;
    if(!deposits.length){adminTable.innerHTML='<tr><td colspan="6" class="no-data">No matching records.</td></tr>';return}
    adminTable.innerHTML='';
    deposits.forEach(d=>{
      const badge=d.status==='approved'?'<span class="badge b-approved">Approved</span>':d.status==='rejected'?'<span class="badge b-rejected">Rejected</span>':'<span class="badge b-pending">Pending</span>';
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>₦${esc(d.amount)}</td><td>${esc(d.senderName)}</td><td>${esc(d.refId)}</td><td>${formatDate(d.date)}</td><td>${badge}</td><td><button class="action approve">Approve</button> <button class="action reject">Reject</button></td>`;
      tr.querySelector('.approve').onclick=async()=>{
        try{
          const userRef=doc(db,'users',d.userId);
          const userDoc=await getDoc(userRef);
          const bal=userDoc.exists()?(userDoc.data().balance||0):0;
          const batch=writeBatch(db);
          batch.update(doc(db,'deposits',d.id),{status:'approved',approvedAt:serverTimestamp()});
          batch.update(userRef,{balance:bal+parseFloat(d.amount||0),updatedAt:serverTimestamp()});
          await batch.commit();
          toast('Deposit approved!');loadDeposits();
        }catch(e){toast('Error: '+e.message)}
      };
      tr.querySelector('.reject').onclick=async()=>{
        try{await updateDoc(doc(db,'deposits',d.id),{status:'rejected',rejectedAt:serverTimestamp()});toast('Deposit rejected');loadDeposits()}
        catch(e){toast('Error: '+e.message)}
      };
      adminTable.appendChild(tr);
    });
  }catch(e){adminTable.innerHTML=`<tr><td colspan="6" class="no-data">${esc(e.message)}</td></tr>`}
}

document.getElementById('searchBtn').onclick=loadDeposits;
document.getElementById('resetBtn').onclick=()=>{searchInput.value='';statusFilter.value='pending';loadDeposits()};
document.getElementById('refreshBtn').onclick=loadDeposits;
statusFilter.onchange=loadDeposits;
</script>
</body>
</html>
