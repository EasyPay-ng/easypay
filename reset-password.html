<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — EasyPay</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif;background:linear-gradient(135deg,#0a1a12,#0f2f1e,#1a4a2e);display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.card{
  background:#fff;padding:36px 28px;border-radius:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);width:100%;max-width:400px;text-align:center;
  animation:fadeUp .5s ease;
}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{width:60px;height:60px;border-radius:50%;object-fit:cover;margin:0 auto 16px;display:block;border:3px solid var(--g1)}
h2{color:var(--g1);font-size:20px;font-weight:700;margin-bottom:6px}
.sub{color:#6b7c6b;font-size:13px;margin-bottom:20px}
.input-group{margin-bottom:16px;text-align:left}
.input-group label{display:block;margin-bottom:5px;font-weight:600;font-size:13px;color:#444}
.input-group input{
  width:100%;padding:12px 14px;border:2px solid #e0e8e3;border-radius:10px;
  font-size:14px;font-family:'Poppins';transition:.2s;
}
.input-group input:focus{border-color:var(--g1);outline:none;box-shadow:0 0 0 3px rgba(0,159,77,.1)}
.btn{
  width:100%;padding:13px;background:linear-gradient(135deg,var(--g1),var(--g2));
  color:#fff;border:none;border-radius:10px;font-weight:700;font-size:15px;
  font-family:'Poppins';cursor:pointer;transition:.3s;
  box-shadow:0 4px 14px rgba(0,159,77,.25);
}
.btn:hover{transform:translateY(-2px)}
.message{margin-top:14px;font-size:13px;font-weight:600}
.success{color:#2e7d32}
.error{color:#c62828}
.back-link{display:block;margin-top:16px;color:var(--g1);text-decoration:none;font-size:13px;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <img src="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg" class="logo" alt="EasyPay">
  <h2>Reset Password</h2>
  <p class="sub">Enter your email and we'll send a reset link.</p>
  <div class="input-group">
    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="you@example.com">
  </div>
  <button class="btn" onclick="resetPassword()">Send Reset Link</button>
  <p id="msg" class="message"></p>
  <a href="login.html" class="back-link">← Back to Login</a>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,sendPasswordResetEmail}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",
  authDomain:"easypay-6bce8.firebaseapp.com",
  projectId:"easypay-6bce8"
});
const auth=getAuth(app);
const msgEl=document.getElementById('msg');

window.resetPassword=()=>{
  const email=document.getElementById('email').value.trim();
  msgEl.textContent='';msgEl.className='message';
  if(!email){msgEl.textContent='Please enter your email.';msgEl.classList.add('error');return}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){msgEl.textContent='Please enter a valid email.';msgEl.classList.add('error');return}
  sendPasswordResetEmail(auth,email)
    .then(()=>{msgEl.textContent='✅ Reset link sent! Check your inbox.';msgEl.classList.add('success')})
    .catch(err=>{
      if(err.code==='auth/user-not-found')msgEl.textContent='❌ No account found with this email.';
      else msgEl.textContent='❌ '+(err.message||'Failed to send reset email.');
      msgEl.classList.add('error');
    });
};
</script>
</body>
</html>
