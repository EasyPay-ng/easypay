<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Users — EasyPay Admin</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261;--bg:#f0f7f4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#1a2e1a}
header{
  background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;
  padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.1);flex-wrap:wrap;gap:8px;
}
header h1{font-size:16px;font-weight:700}
.header-controls{display:flex;gap:8px;align-items:center}
header button{
  background:rgba(255,255,255,.15);color:#fff;border:none;padding:6px 12px;
  border-radius:8px;cursor:pointer;font-weight:600;font-size:12px;font-family:'Poppins';
}
.container{padding:20px;max-width:1200px;margin:auto}
.search-bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.search-bar input{flex:1;padding:10px;border:2px solid #e0e8e3;border-radius:10px;font-size:13px;min-width:180px;font-family:'Poppins'}
.search-bar select{padding:10px;border:2px solid #e0e8e3;border-radius:10px;font-size:13px;font-family:'Poppins'}
.search-bar button{background:var(--g1);color:#fff;border:none;padding:10px 16px;border-radius:10px;cursor:pointer;font-weight:600;font-family:'Poppins';font-size:13px}
.table-wrap{overflow-x:auto;background:#fff;border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:var(--g1);color:#fff;padding:10px 14px;font-size:12px;text-align:left;font-weight:600}
td{padding:10px 14px;border-bottom:1px solid #f0f0f0;font-size:13px}
tbody tr:hover{background:#f8fff9}
.btn{padding:5px 10px;border:none;border-radius:6px;cursor:pointer;font-size:11px;font-weight:700;color:#fff;font-family:'Poppins'}
.btn-edit{background:#4caf50}.btn-suspend{background:#dc3545}.btn-history{background:#2196f3}.btn-plan{background:#ff9800}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:700;color:#fff}
.badge-none{background:#bbb}.badge-mini{background:#e91e63}.badge-starter{background:#ff9800}
.badge-basic{background:#4caf50}.badge-first{background:#00bcd4}.badge-second{background:#7c4dff}.badge-third{background:#ff6d00}
.modal-bg{position:fixed;top:0;left:0;width:100vw;height:100vh;background:rgba(0,0,0,.4);display:none;justify-content:center;align-items:center;z-index:1000}
.modal-bg.show{display:flex}
.modal{background:#fff;padding:24px;border-radius:16px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal h2{margin-bottom:14px;font-size:18px;color:var(--g1)}
.modal label{display:block;margin:8px 0 4px;font-weight:600;font-size:13px}
.modal input,.modal select{width:100%;padding:10px;border:2px solid #e0e8e3;border-radius:8px;font-size:13px;font-family:'Poppins'}
.modal .actions{margin-top:16px;text-align:right;display:flex;gap:8px;justify-content:flex-end}
.modal .actions button{padding:8px 16px;border:none;border-radius:8px;cursor:pointer;font-weight:600;font-family:'Poppins';font-size:13px}
.modal .btn-save{background:var(--g1);color:#fff}
.modal .btn-cancel{background:#f1f3f2;color:#444}
.no-data{text-align:center;padding:24px;color:#999}
#statusMsg{color:#fff;font-size:12px;opacity:.9}
</style>
</head>
<body>
<header>
  <h1>Manage Users</h1>
  <div class="header-controls">
    <span id="statusMsg"></span>
    <button id="logoutBtn">Logout</button>
  </div>
</header>
<main class="container">
  <div class="search-bar">
    <input id="searchInput" placeholder="Search username, email, or UID...">
    <select id="planFilter">
      <option value="">All Plans</option>
      <option value="none">No Plan</option>
      <option value="First">First</option>
      <option value="Second">Second</option>
      <option value="Third">Third</option>
      <option value="Mini">Mini</option>
      <option value="Starter">Starter</option>
      <option value="Basic">Basic</option>
    </select>
    <button id="searchBtn">Search</button>
  </div>
  <div id="tableWrap"><p class="no-data">Loading users...</p></div>
</main>

<div class="modal-bg" id="editModal">
  <div class="modal">
    <h2 id="modalTitle">Edit User</h2>
    <label>Username</label><input id="editUsername">
    <label>Balance</label><input id="editBalance" type="number">
    <label>Plan</label>
    <select id="editPlan">
      <option value="none">None</option><option value="First">First</option>
      <option value="Second">Second</option><option value="Third">Third</option>
      <option value="Mini">Mini</option><option value="Starter">Starter</option>
      <option value="Basic">Basic</option>
    </select>
    <label>Remark</label><input id="editRemark" placeholder="Adjustment note...">
    <div class="actions">
      <button class="btn-cancel" id="cancelEdit">Cancel</button>
      <button class="btn-save" id="saveEdit">Save</button>
    </div>
  </div>
</div>

<div class="modal-bg" id="historyModal">
  <div class="modal">
    <h2>Transaction History</h2>
    <ul id="historyList" style="list-style:none;max-height:300px;overflow:auto"></ul>
    <div class="actions"><button class="btn-cancel" id="closeHistory">Close</button></div>
  </div>
</div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,collection,getDocs,doc,updateDoc,query,orderBy,limit,getDocs as getSubDocs,addDoc,serverTimestamp,writeBatch,getDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",authDomain:"easypay-6bce8.firebaseapp.com",projectId:"easypay-6bce8"});
const auth=getAuth(app);const db=getFirestore(app);

const wrap=document.getElementById('tableWrap');
const searchInput=document.getElementById('searchInput');
const planFilter=document.getElementById('planFilter');
const statusMsg=document.getElementById('statusMsg');

let users=[],editingUid=null;

document.getElementById('logoutBtn').onclick=()=>signOut(auth).then(()=>location.href='login.html');

onAuthStateChanged(auth,async user=>{
  if(!user)return signOut(auth).then(()=>location.href='login.html');
  const snap=await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()||snap.data().role!=='admin')return signOut(auth).then(()=>location.href='login.html');
  loadUsers();
});

document.getElementById('searchBtn').onclick=filterTable;
searchInput.onkeypress=e=>{if(e.key==='Enter')filterTable()};
planFilter.onchange=filterTable;

function getPlanBadge(plan){
  const p=(plan||'none').toLowerCase();
  if(p==='none')return'<span class="badge badge-none">No Plan</span>';
  if(['first','second','third','mini','starter','basic'].includes(p))
    return`<span class="badge badge-${p}">${plan}</span>`;
  return`<span class="badge badge-none">${plan||'No Plan'}</span>`;
}

async function loadUsers(){
  wrap.innerHTML='<p class="no-data">Loading users...</p>';
  const snap=await getDocs(collection(db,'users'));
  users=snap.docs.map(d=>({id:d.id,...d.data()}));
  render(users);
}

function render(list){
  if(!list.length){wrap.innerHTML='<p class="no-data">No users found.</p>';return}
  let html='<table><thead><tr><th>Username</th><th>Email</th><th>Plan</th><th>Balance</th><th>Actions</th></tr></thead><tbody>';
  for(const u of list){
    html+=`<tr>
      <td>${esc(u.username||'—')}</td>
      <td>${esc(u.email||'—')}</td>
      <td>${getPlanBadge(u.activePlan||u.plan)}</td>
      <td>₦${(u.balance||0).toFixed(2)}</td>
      <td>
        <button class="btn btn-edit" data-id="${u.id}">Edit</button>
        <button class="btn btn-suspend" data-id="${u.id}">${u.suspended?'Unsuspend':'Suspend'}</button>
        <button class="btn btn-history" data-id="${u.id}">History</button>
      </td>
    </tr>`;
  }
  html+='</tbody></table>';
  wrap.innerHTML=html;
  wrap.querySelectorAll('.btn-edit').forEach(b=>b.onclick=()=>openEdit(b.dataset.id));
  wrap.querySelectorAll('.btn-suspend').forEach(b=>b.onclick=()=>toggleSuspend(b.dataset.id));
  wrap.querySelectorAll('.btn-history').forEach(b=>b.onclick=()=>viewHistory(b.dataset.id));
}

function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

function filterTable(){
  const q=searchInput.value.trim().toLowerCase();
  const p=planFilter.value;
  render(users.filter(u=>{
    const match=!q||(u.username||'').toLowerCase().includes(q)||(u.email||'').toLowerCase().includes(q)||u.id.toLowerCase().includes(q);
    const planMatch=!p||(u.activePlan||u.plan||'none').toLowerCase()===p.toLowerCase();
    return match&&planMatch;
  }));
}

function openEdit(uid){
  editingUid=uid;const u=users.find(x=>x.id===uid);
  document.getElementById('editUsername').value=u.username||'';
  document.getElementById('editBalance').value=u.balance||0;
  document.getElementById('editPlan').value=u.activePlan||u.plan||'none';
  document.getElementById('editRemark').value='';
  document.getElementById('modalTitle').textContent='Edit User';
  document.getElementById('editModal').classList.add('show');
}

document.getElementById('cancelEdit').onclick=()=>document.getElementById('editModal').classList.remove('show');
document.getElementById('saveEdit').onclick=async()=>{
  const newName=document.getElementById('editUsername').value.trim();
  const newBal=parseFloat(document.getElementById('editBalance').value)||0;
  const newPlan=document.getElementById('editPlan').value;
  const remark=document.getElementById('editRemark').value.trim()||'Admin Adjustment';
  const uBefore=users.find(x=>x.id===editingUid);
  const delta=newBal-(uBefore.balance||0);
  const updates={username:newName,balance:newBal};
  if(newPlan!=='none')updates.activePlan=newPlan;
  await updateDoc(doc(db,'users',editingUid),updates);
  if(delta!==0){
    await addDoc(collection(db,'users',editingUid,'transactionHistory'),{type:'Admin Adjustment',amount:delta,remark,timestamp:serverTimestamp()});
  }
  document.getElementById('editModal').classList.remove('show');
  loadUsers();
};

async function toggleSuspend(uid){
  const u=users.find(x=>x.id===uid);
  await updateDoc(doc(db,'users',uid),{suspended:!u.suspended});
  loadUsers();
}

async function viewHistory(uid){
  document.getElementById('historyList').innerHTML='<li class="no-data">Loading...</li>';
  document.getElementById('historyModal').classList.add('show');
  const q=query(collection(db,'users',uid,'transactionHistory'),orderBy('timestamp','desc'),limit(10));
  const snap=await getSubDocs(q);
  const list=document.getElementById('historyList');
  if(snap.empty){list.innerHTML='<li class="no-data">No transactions.</li>';return}
  list.innerHTML='';
  snap.forEach(d=>{
    const t=d.data();
    const time=t.timestamp?.toDate?.()?.toLocaleString?.()||'';
    list.innerHTML+=`<li style="padding:8px 0;border-bottom:1px solid #eee"><strong>${esc(t.type)}</strong>: ₦${(t.amount||0).toFixed(2)}<br><em style="font-size:12px;color:#666">${esc(t.remark||'')}</em><br><small style="color:#999">${esc(time)}</small></li>`;
  });
}
document.getElementById('closeHistory').onclick=()=>document.getElementById('historyModal').classList.remove('show');
</script>
</body>
</html>
