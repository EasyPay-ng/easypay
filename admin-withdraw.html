<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Withdrawals — EasyPay</title>
<link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dq7fpxfbc/image/upload/v1772198392/1000250298_iy0yq0.jpg">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g1:#009f4d;--g2:#00c261;--bg:#f0f7f4}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Poppins',sans-serif}
body{background:var(--bg);color:#1a2e1a;padding:20px}
.container{max-width:1200px;margin:auto}
h2{color:var(--g1);margin-bottom:12px;font-size:18px}
.back{display:inline-block;margin-bottom:12px;color:var(--g1);text-decoration:none;font-weight:600;font-size:13px}
.total-box{
  background:#e8f5e9;color:#006b35;padding:12px 18px;border-radius:12px;
  font-weight:700;display:inline-block;margin-bottom:16px;font-size:14px;
}
.table-wrap{background:#fff;border-radius:14px;overflow:auto;box-shadow:0 4px 16px rgba(0,0,0,.05)}
table{width:100%;border-collapse:collapse;min-width:700px}
th{background:var(--g1);color:#fff;padding:10px 12px;font-size:11px;text-align:left;font-weight:600;position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid #f0f0f0;font-size:13px}
tbody tr:hover{background:#f8fff9}
select{padding:6px 10px;border-radius:8px;border:2px solid #e0e8e3;font-size:12px;font-family:'Poppins';font-weight:600}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:#1a2e1a;color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;z-index:10000;transition:transform .4s;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<a href="admin.html" class="back">← Admin Dashboard</a>
<div class="container">
  <h2>Withdrawal Records</h2>
  <div class="total-box" id="totalAmount">Loading...</div>
  <div class="table-wrap">
    <table id="withdrawalTable">
      <thead>
        <tr><th>Date</th><th>Amount</th><th>Bank</th><th>Account #</th><th>Account Name</th><th>Plan</th><th>Status</th></tr>
      </thead>
      <tbody><tr><td colspan="7" style="text-align:center;color:#999;padding:20px">Loading...</td></tr></tbody>
    </table>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import{getFirestore,collectionGroup,getDocs,doc,updateDoc,getDoc}from"https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDRkip46Ql5KhNfuatWAcAxQzgP5VtQ8UY",authDomain:"easypay-6bce8.firebaseapp.com",projectId:"easypay-6bce8"});
const db=getFirestore(app);const auth=getAuth(app);

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

onAuthStateChanged(auth,async user=>{
  if(!user)return;
  const snap=await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()||snap.data().role!=='admin'){document.body.innerHTML='<h2 style="padding:20px">Not authorized</h2>';return}
  loadWithdrawals();
});

async function loadWithdrawals(){
  const q=collectionGroup(db,'withdrawals');
  const snapshot=await getDocs(q);
  const allDocs=[];let totalNet=0;const userPathsSet=new Set();

  snapshot.forEach(docSnap=>{
    const data=docSnap.data();
    if(typeof data.amount==='number'&&(data.status==='Successful'||data.status==='approved'))totalNet+=data.amount;
    const parts=docSnap.ref.path.split('/');
    const uid=parts.length>=2?parts[1]:'N/A';
    const userPath=parts.length>=2?parts[0]+'/'+parts[1]:null;
    if(userPath)userPathsSet.add(userPath);
    allDocs.push({path:docSnap.ref.path,data,uid,userPath,plan:data.plan||null});
  });

  const userPaths=Array.from(userPathsSet);
  const userPlanMap={};
  await Promise.all(userPaths.map(async p=>{
    const[col,id]=p.split('/');
    const snap=await getDoc(doc(db,col,id));
    userPlanMap[p]=snap.exists()?(snap.data().plan||'N/A'):'N/A';
  }));
  allDocs.forEach(item=>{if(!item.plan)item.plan=item.userPath&&userPlanMap[item.userPath]?userPlanMap[item.userPath]:'N/A'});

  allDocs.sort((a,b)=>{
    const sa=a.data.status,sb=b.data.status;
    if(sa==='pending'&&sb!=='pending')return-1;
    if(sa!=='pending'&&sb==='pending')return1;
    return(b.data.timestamp?.seconds||0)-(a.data.timestamp?.seconds||0);
  });

  document.getElementById('totalAmount').textContent='Total Withdrawn: ₦'+totalNet.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
  const tbody=document.querySelector('#withdrawalTable tbody');
  tbody.innerHTML='';

  allDocs.forEach(item=>{
    const d=item.data;
    const dateStr=d.timestamp?.seconds?new Date(d.timestamp.seconds*1000).toLocaleString():'N/A';
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${esc(dateStr)}</td>
      <td>₦${esc(d.amount)}</td>
      <td>${esc(d.bank||'N/A')}</td>
      <td>${esc(d.accNumber||'N/A')}</td>
      <td>${esc(d.accName||'N/A')}</td>
      <td>${esc(item.plan)}</td>
      <td>
        <select data-path="${item.path}" onchange="updateStatus(this)">
          <option value="pending" ${d.status==='pending'?'selected':''}>Pending</option>
          <option value="approved" ${d.status==='approved'||d.status==='Successful'?'selected':''}>Approved</option>
          <option value="rejected" ${d.status==='rejected'||d.status==='Rejected'?'selected':''}>Rejected</option>
        </select>
      </td>`;
    tbody.appendChild(tr);
  });
}

window.updateStatus=async function(selectEl){
  const path=selectEl.getAttribute('data-path');
  const newStatus=selectEl.value;
  const parts=path.split('/');
  const ref=doc(db,...parts);
  await updateDoc(ref,{status:newStatus});
  toast('Status updated to '+newStatus);
};
</script>
</body>
</html>
